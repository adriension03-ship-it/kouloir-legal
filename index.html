<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kouloir · Le fil anonyme de ton campus</title>
<meta name="description" content="Kouloir, le fil anonyme de ton campus. Your campus, anonymously.">
<meta name="theme-color" content="#C6FF3D">

<!-- Bannière Safari « Ouvrir dans l'App Store » : remplacer 0000000000 par l'Apple ID de l'app -->
<meta name="apple-itunes-app" content="app-id=6836880559">

<meta property="og:title" content="Kouloir">
<meta property="og:description" content="Ton campus. Librement.">
<meta property="og:url" content="https://kouloir.fr">
<meta property="og:type" content="website">

<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="accueil.css">
<script src="config.js"></script>
</head>
<body>

<main>
  <div class="hero">
    <div class="top-bar">
      <a class="brand" href="./">
        <img src="logo.svg" alt="">
        <span>Kouloir</span>
      </a>
      <button class="lang" id="lang" type="button" aria-label="English">EN</button>
    </div>

    <h1 data-fr="<span class=&quot;l&quot;>Ton campus.</span><span class=&quot;l&quot;>Librement.</span>" data-en="<span class=&quot;l&quot;>Your campus.</span><span class=&quot;l&quot;>Freely.</span>"><span class="l">Ton campus.</span><span class="l">Librement.</span></h1>


  </div>

  <div class="actions">
    <a class="primary" id="store" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>
      <span id="store-label">Télécharger sur l’App Store</span>
    </a>
  </div>
</main>

<footer id="links-fr">
  <a href="cgu.html">CGU</a>
  <a href="confidentialite.html">Confidentialité</a>
  <a href="mentions-legales.html">Mentions légales</a>
  <a href="signaler.html">Signaler un contenu</a>
  <a href="mailto:contact@kouloir.fr">contact@kouloir.fr</a>
</footer>
<footer id="links-en" hidden>
  <a href="terms.html">Terms of Use</a>
  <a href="privacy.html">Privacy</a>
  <a href="legal-notice.html">Legal notice</a>
  <a href="report.html">Report content</a>
  <a href="mailto:contact@kouloir.fr">contact@kouloir.fr</a>
</footer>

<script>
(function () {
  var k = window.KOULOIR || {};
  var store = document.getElementById("store");
  var label = document.getElementById("store-label");
  var btn = document.getElementById("lang");

  var TEXT = {
    fr: { live: "Télécharger sur l’App Store", soon: "Bientôt sur l’App Store" },
    en: { live: "Download on the App Store", soon: "Coming soon to the App Store" }
  };

  function setLang(lang) {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-fr]").forEach(function (el) {
      el.innerHTML = el.getAttribute("data-" + lang);
    });
    label.textContent = k.LIVE ? TEXT[lang].live : TEXT[lang].soon;
    document.getElementById("links-fr").hidden = lang !== "fr";
    document.getElementById("links-en").hidden = lang !== "en";
    btn.textContent = lang === "fr" ? "EN" : "FR";
    btn.setAttribute("aria-label", lang === "fr" ? "English" : "Français");
    btn.onclick = function () { setLang(lang === "fr" ? "en" : "fr"); };
  }

  if (k.LIVE) {
    store.href = k.APP_URL;
  } else {
    store.classList.add("soon");
    store.removeAttribute("href");
    store.setAttribute("aria-disabled", "true");
  }

  // Même logique que l'app : français par défaut, anglais si le téléphone est en anglais
  var nav = (navigator.language || "fr").toLowerCase();
  setLang(nav.indexOf("fr") === 0 ? "fr" : (nav.indexOf("en") === 0 ? "en" : "fr"));
})();
</script>
</body>
</html>
